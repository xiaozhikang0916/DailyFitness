name: CI

on:
  push:
    branches:
      - '**'        # 所有分支（含 main 与普通开发分支）
    tags:
      - 'v*'        # main 分支上创建的新 tag，如 v1.1.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) 普通开发分支推送：构建所有模块的 Debug 产物并运行单元测试
  debug-build:
    name: Debug build + unit tests (dev branches)
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      # test 为所有模块所有变体的单元测试聚合任务（AGP 任务为 test<Variant>UnitTest）
      - name: Assemble debug & run unit tests (all modules)
        run: ./gradlew assembleDebug test

  # 2) main 分支推送：所有模块 assemble + 单元测试
  main-build:
    name: Assemble + unit tests (main)
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: Build release
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Restore key_store file from Base64
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > release.keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_FILE_BASE64 }}
      # assemble 会构建所有模块的全部变体（含 release），需要签名密钥
      - name: Assemble all variants & run unit tests
        run: ./gradlew assemble test
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore

  # 3) main 分支上的新 tag：assembleRelease 并把产物发布到 GitHub Release
  release:
    name: Release APK (tag)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: Build release
    permissions:
      contents: write   # 允许向 GitHub Release 上传产物
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Restore key_store file from Base64
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > release.keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_FILE_BASE64 }}
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      - name: Publish APK & mapping to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
