name: Build and Upload Android Release APK
on:
  push:
    branches:
      - main
jobs:
  build_and_upload_apk:
    runs-on: ubuntu-latest
    environment: Build release
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Restore key_store file from Base64
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > release.keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_FILE_BASE64 }}
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_FILE: release.keystore
      - name: Upload APK and Mapping files
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
